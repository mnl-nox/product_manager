plugins {
    id 'com.android.application'
}

def configuredAppUrl = project.findProperty('appUrl') ?: 'https://example.invalid/'

android {
    namespace 'com.mnlnox.productmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mnlnox.productmanager'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'APP_URL', '"' + configuredAppUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
