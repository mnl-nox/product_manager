plugins {
    id 'com.android.application'
}

def configuredAppUrl = project.findProperty('appUrl') ?: 'https://example.invalid/'
def appVersion = (rootProject.file('../VERSION').text.trim())
def versionParts = appVersion.tokenize('.').collect { it.toInteger() }
def configuredVersionCode = (versionParts[0] * 1000000) + (versionParts[1] * 1000) + versionParts[2]
def releaseStoreFile = project.findProperty('releaseStoreFile')
def releaseStorePassword = project.findProperty('releaseStorePassword')
def releaseKeyAlias = project.findProperty('releaseKeyAlias')
def releaseKeyPassword = project.findProperty('releaseKeyPassword')

android {
    namespace 'com.mnlnox.productmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mnlnox.productmanager'
        minSdk 23
        targetSdk 35
        versionCode configuredVersionCode
        versionName appVersion
        buildConfigField 'String', 'APP_URL', '"' + configuredAppUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    signingConfigs {
        if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
