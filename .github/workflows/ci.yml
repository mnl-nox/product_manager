name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q api scripts tests
      - name: Run API tests
        run: make test
  c23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C core
        run: make
