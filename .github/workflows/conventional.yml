name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Normalize branch-style PR title
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^([A-Za-z]+)\/\s*(.+)$/);
            if (!match) return;

            const type = match[1].toLowerCase();
            const subject = match[2].trim();
            const valid = new Set([
              'feat', 'fix', 'docs', 'style', 'refactor', 'perf',
              'test', 'build', 'ci', 'chore', 'revert'
            ]);

            if (!valid.has(type) || !subject) return;

            const normalized = `${type}: ${subject}`;
            if (title === normalized) return;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              title: normalized
            });

      - name: Validate Conventional Commit
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: "Use Conventional Commits: type(scope): description"
          wip: false

      - name: Add conventional label
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^([a-z]+)(?:\([^)]*\))?(!)?(?:\:\s|\/)\s*.+$/i);
            if (!match) return;

            const type = match[1].toLowerCase();
            const breaking = Boolean(match[2]);
            const valid = new Set([
              'feat', 'fix', 'docs', 'style', 'refactor', 'perf',
              'test', 'build', 'ci', 'chore', 'revert'
            ]);

            if (!valid.has(type)) return;

            const label = breaking ? 'type: breaking' : `type: ${type}`;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });
