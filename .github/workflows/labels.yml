name: Repository Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/labels.yml'
      - '.github/labels.yml'

permissions:
  contents: read
  issues: write

jobs:
  provision:
    name: Provision labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ruby -ryaml -ropen3 <<'RUBY'
          config = YAML.safe_load_file('.github/labels.yml', permitted_classes: [], aliases: false)
          labels = config.fetch('labels')
          abort 'Expected labels to be a non-empty array.' unless labels.is_a?(Array) && !labels.empty?

          names = []
          labels.each do |label|
            abort "Invalid label record: #{label.inspect}" unless label.is_a?(Hash)
            name = label['name']
            color = label['color']
            description = label['description']
            abort "Incomplete label record: #{label.inspect}" unless name.is_a?(String) && !name.empty? && color.is_a?(String) && color.match?(/\A[0-9A-Fa-f]{6}\z/) && description.is_a?(String) && !description.empty?
            abort "Duplicate label name: #{name}" if names.include?(name)
            names << name

            output, error, status = Open3.capture3(
              'gh', 'label', 'create', name, '--repo', ENV.fetch('REPO'),
              '--color', color, '--description', description, '--force'
            )
            print output
            warn error unless error.empty?
            abort "Could not provision label: #{name}" unless status.success?
          end
          RUBY
