name: Semantic Version Tag

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Calculate and create release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Publish manually pushed version tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout origin/main
          python3 scripts/release_notes.py "$TAG" > release-notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Product Manager $TAG" --notes-file release-notes.md
          fi

      - name: Calculate version
        id: version
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail

          last_tag="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1 || true)"

          first_release=false
          if [[ -z "$last_tag" ]]; then
            current="$(tr -d '[:space:]' < VERSION)"
            range="HEAD"
            first_release=true
          else
            current="${last_tag#v}"
            range="${last_tag}..HEAD"
          fi

          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest version is not SemVer: $current"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$current"

          if [[ "$first_release" == "true" ]]; then
            # The repository already maintains VERSION and CHANGELOG.md.
            # Use that version for the first automated tag instead of
            # incorrectly calculating from 0.0.0 across the entire history.
            next="v$major.$minor.$patch"
          else
            mapfile -t commits < <(git log "$range" --pretty=format:%s)
            has_commit=0
            bump=0
            breaking_re='^[a-z]+(\([^)]*\))?!:'
            feature_re='^feat(\([^)]*\))?:'
            patch_re='^(fix|perf|refactor|revert|build|ci|test|docs|style|chore)(\([^)]*\))?:'

            for subject in "${commits[@]}"; do
              [[ -z "$subject" ]] && continue

              if [[ "$subject" =~ $breaking_re ]] || [[ "$subject" == *"BREAKING CHANGE"* ]]; then
                bump=2
                has_commit=1
                continue
              fi

              if [[ "$subject" =~ $feature_re ]]; then
                if (( bump < 1 )); then bump=1; fi
                has_commit=1
                continue
              fi

              if [[ "$subject" =~ $patch_re ]]; then
                has_commit=1
              fi
            done

            if (( has_commit == 0 )); then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            case "$bump" in
              2)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              1)
                minor=$((minor + 1))
                patch=0
                ;;
              0)
                patch=$((patch + 1))
                ;;
            esac

            next="v$major.$minor.$patch"
          fi

          if git rev-parse "$next" >/dev/null 2>&1; then
            echo "Tag already exists: $next"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "release: $TAG"
          git push origin "$TAG"

      - name: Publish release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/release_notes.py "$TAG" > release-notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Product Manager $TAG" --notes-file release-notes.md
          fi

      - name: Build platform packages
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run packages.yml --ref "$TAG"
