name: Cross-platform packages

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_URL: https://product-manager-14fq.onrender.com/

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: availability
        name: Check package sources
        shell: pwsh
        run: |
          if (Test-Path 'packaging/product_manager.spec') { "ready=true" >> $env:GITHUB_OUTPUT } else { "ready=false" >> $env:GITHUB_OUTPUT }
      - uses: actions/setup-python@v5
        if: steps.availability.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Select package version
        if: steps.availability.outputs.ready == 'true'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = (Get-Content VERSION -Raw).Trim() }
          "PRODUCT_MANAGER_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build Windows installer
        if: steps.availability.outputs.ready == 'true'
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        if: steps.availability.outputs.ready == 'true'
        with:
          name: product-manager-windows
          path: build/packages/ProductManager-*-windows-x64-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: availability
        run: |
          if test -f packaging/linux/build-packages.sh; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - name: Install RPM build tools
        if: steps.availability.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build Debian and RPM packages
        if: steps.availability.outputs.ready == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="$(cat VERSION)"; fi
          bash packaging/linux/build-packages.sh "$version" --require-rpm
      - uses: actions/upload-artifact@v4
        if: steps.availability.outputs.ready == 'true'
        with:
          name: product-manager-linux
          path: build/packages/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - id: signing
        name: Check whether Android release signing is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Android AAB signing secrets are not configured; the signed Play Store bundle will be skipped.'
          fi
      - name: Build Android APK for direct installation
        run: gradle --no-daemon -p android assembleDebug "-PappUrl=$APP_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-validation
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare Android release signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/product-manager-release.jks"
      - name: Build signed Android APK and App Bundle
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          gradle --no-daemon -p android assembleRelease bundleRelease "-PappUrl=$APP_URL"
          "-PreleaseStoreFile=$RUNNER_TEMP/product-manager-release.jks"
          "-PreleaseStorePassword=$KEYSTORE_PASSWORD" "-PreleaseKeyAlias=$KEY_ALIAS"
          "-PreleaseKeyPassword=$KEY_PASSWORD"
      - name: Name Android App Bundle
        if: steps.signing.outputs.ready == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="$(cat VERSION)"; fi
          mkdir -p build/packages
          cp android/app/build/outputs/apk/release/*.apk "build/packages/product-manager-${version}-android.apk"
          cp android/app/build/outputs/bundle/release/*.aab "build/packages/product-manager-${version}-android.aab"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: product-manager-android-release
          path: build/packages/product-manager-*-android.*
          if-no-files-found: error

  android-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: availability
        run: |
          if test -f ui/manifest.webmanifest && test -f ui/service-worker.js; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - name: Build PWA deployment archive
        if: steps.availability.outputs.ready == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="$(cat VERSION)"; fi
          bash packaging/android/build-pwa.sh "$version"
      - uses: actions/upload-artifact@v4
        if: steps.availability.outputs.ready == 'true'
        with:
          name: product-manager-android-pwa
          path: build/packages/product-manager-pwa-*.zip
          if-no-files-found: error

  publish-release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android, android-pwa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: product-manager-*
          path: build/release
          merge-multiple: true
      - name: Attach platform downloads to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" build/release/* --repo "$GITHUB_REPOSITORY" --clobber
