name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL HTTPS da implantação do Product Manager (ex.: https://product-manager.onrender.com)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Validate app URL
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = urlparse(os.environ["APP_URL"].strip())
          if url.scheme != "https" or not url.hostname:
              raise SystemExit("Informe uma URL HTTPS válida para a aplicação implantada.")
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          gradle --no-daemon -p android assembleDebug "-PappUrl=$APP_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: product-manager-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
