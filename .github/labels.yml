# Repository labels. The labels workflow provisions these values in GitHub.
labels:
  - name: "type: feat"
    color: "1D76DB"
    description: New functionality
  - name: "type: fix"
    color: "D73A4A"
    description: Bug fix
  - name: "type: docs"
    color: "0075CA"
    description: Documentation
  - name: "type: style"
    color: "5319E7"
    description: Formatting or style
  - name: "type: refactor"
    color: "A2EEEF"
    description: Internal refactor
  - name: "type: perf"
    color: "FBCA04"
    description: Performance improvement
  - name: "type: test"
    color: "7057FF"
    description: Tests
  - name: "type: build"
    color: "BFD4F2"
    description: Build system
  - name: "type: ci"
    color: "0366D6"
    description: Continuous integration
  - name: "type: chore"
    color: "C5DEF5"
    description: Maintenance
  - name: "type: revert"
    color: "E4E669"
    description: Revert
  - name: "type: breaking"
    color: "B60205"
    description: Breaking change
  - name: "status: ready"
    color: "0E8A16"
    description: Ready for implementation
  - name: "status: in-progress"
    color: "FBCA04"
    description: Work in progress
  - name: "status: needs-review"
    color: "D93F0B"
    description: Awaiting review
  - name: "status: blocked"
    color: "5319E7"
    description: Blocked
  - name: "status: done"
    color: "0E8A16"
    description: Completed
  - name: "area: core"
    color: "C2E0C6"
    description: Core domain
  - name: "area: terminal"
    color: "C5DEF5"
    description: Terminal interface
  - name: "area: persistence"
    color: "BFD4F2"
    description: Persistence
  - name: "area: security"
    color: "D73A4A"
    description: Security
  - name: "area: documentation"
    color: "0075CA"
    description: Documentation
  - name: "area: products"
    color: "1D76DB"
    description: Product catalog
  - name: "area: api"
    color: "0366D6"
    description: HTTP API
  - name: "area: web"
    color: "5319E7"
    description: Web interface
  - name: "area: testing"
    color: "7057FF"
    description: Automated tests
